<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>rappu — interfaces em movimento</title>
  <meta name="description" content="Um livro 3D interativo com seis landing pages vivas: abra, folheie e brinque com cada página.">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 3D Canvas Host -->
  <div id="canvas-container"></div>

  <!-- Atmospheric Peripheral Edge Vignette -->
  <div id="vignette-overlay"></div>



  <!-- Seamless Loading State -->
  <div id="loading-overlay">
    <div class="loader-spinner"></div>
    <div class="loader-text">PREPARANDO O LIVRO</div>
  </div>

  <!-- Floating UI Interface Layer -->
  <div class="ui-layer">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <span>rappu</span>
          <span class="brand-dot"></span>
        </div>
      </div>

      <div class="top-actions">
        <button id="btn-close" class="pill-btn when-open" aria-label="Fechar o livro">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Fechar</span>
        </button>
        <button id="btn-sound" class="icon-btn" aria-label="Som" title="Som">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path class="sound-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
    </header>

    <footer class="bottom-bar">
      <button id="hint-closed" class="hint-pill when-closed">
        <span class="hint-dot"></span>
        Clique no livro para abrir
      </button>

      <div id="dock" class="pagination-dock when-open">
        <button id="btn-prev" class="nav-btn" aria-label="Página anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="page-counter" class="page-counter"></div>
        <div id="page-dots" class="page-dots"></div>
        <button id="btn-next" class="nav-btn" aria-label="Próxima página">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span class="dock-sep"></span>
        <button id="btn-zoom" class="nav-btn" aria-label="Ampliar página" title="Ampliar página (Z)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- CDN Core Libraries: Three.js r128 & GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Application Modules -->
  <script src="js/audio.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/book.js"></script>
  <script src="js/desk.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
